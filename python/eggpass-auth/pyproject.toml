[build-system]
requires = ["maturin>=1.16.0,<2.0"]
build-backend = "maturin"

[project]
name = "eggpass-auth"
version = "0.1.1"
description = "Async Python bindings for the eggpass-auth OAuth client"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["oauth", "oauth2", "asyncio", "authentication", "pyo3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/eggstack/eggpass"
Documentation = "https://github.com/eggstack/eggpass/tree/main/python/eggpass-auth"
Repository = "https://github.com/eggstack/eggpass"
Issues = "https://github.com/eggstack/eggpass/issues"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "eggpass_auth._native"
bindings = "pyo3"
python-source = "src"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
