[package]
name = "eggpass-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Async OAuth authentication flows for applications using Eggfetch"
license = "MIT"
readme = "README.md"
repository = "https://github.com/eggstack/eggpass"
documentation = "https://docs.rs/eggpass-auth"
keywords = ["oauth", "authentication", "async"]
categories = ["asynchronous", "authentication"]
include = ["/src", "/README.md", "/LICENSE", "/examples"]

[dependencies]
base64 = "0.23.1"
eggfetch-core = { version = "0.4.0", default-features = false, features = ["native-http1", "tls-rustls"] }
form_urlencoded = "1.2.2"
http = "1"
http-body-util = "0.1"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }

[package.metadata.docs.rs]
all-features = true
