[package]
name = "grokproxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight, local, OpenAI-compatible proxy for Grok models using x.ai OAuth"
license = "MIT"
readme = "README.md"
keywords = ["grok", "xai", "openai", "proxy", "oauth"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.23.1"
daemonize = "0.5.0"
dirs = "7.0.0"
nix = { version = "0.31.3", features = ["signal", "process"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.4.6"
toml = "1.2.1"
ureq = "3.5.2"
webbrowser = "1.2.7"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
