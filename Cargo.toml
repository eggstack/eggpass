[package]
name = "eggpass"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A lightweight, local, OpenAI-compatible proxy for Grok and ChatGPT, authenticated with your own subscription over OAuth"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/eggstack/eggpass"
repository = "https://github.com/eggstack/eggpass"
documentation = "https://docs.rs/eggpass"
keywords = ["grok", "chatgpt", "openai", "proxy", "oauth"]
categories = ["command-line-utilities", "api-bindings"]

# The published crate carries the source and the documentation, and nothing
# else: no CI definitions, no live-verification script, no build output.
include = [
    "/src",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
base64 = "0.23.1"
daemonize = "0.5.0"
dirs = "7.0.0"
# Self-update mechanics. Acquisition, transport, release-manifest projection,
# digest binding, staging, locking, and rollback are owned by the published
# Eggup crates rather than reimplemented here.
#
# `eggup-eggfetch` is the production transport: `eggup-curl` is smaller, but
# `CurlConfig` has no User-Agent seam and the adapter clears the child
# environment, so every request goes out as `curl/x.y` and the release host
# answers 403. A transport that cannot reach the version authority is not
# qualified, however small it is.
#
# `eggup-eggpack` reads an Eggpack `ReleaseManifest` v1. Its `project_json`
# takes the manifest as bytes, so `eggpack-manifest` is not a direct
# dependency and no version pin has to be mirrored here.
eggup-acquisition = "0.2.0"
eggup-core = "0.2.0"
eggup-eggpack = "0.2.0"
eggup-eggfetch = "0.2.0"
# `term` brings in `nix::sys::termios` and `nix::pty`, which the interactive
# provider picker uses for raw mode and for its pseudoterminal tests.
nix = { version = "0.31.3", features = ["signal", "process", "term"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.4.6"
toml = "1.2.1"
ureq = "3.5.2"
# WHATWG parser for the device-flow URL check. Pinned to the copy already
# in Cargo.lock; the check is the parser, so do not bump it in passing.
url = "=2.5.8"
webbrowser = "1.2.7"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
