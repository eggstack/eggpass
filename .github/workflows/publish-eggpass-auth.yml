name: Publish eggpass-auth to crates.io

# Auth crate versions and releases are independent of the Eggpass binary.
# Publishing only follows a human-published eggpass-auth-vX.Y.Z release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify the package without publishing it"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    if: >-
      (github.event_name == 'release' &&
      startsWith(github.event.release.tag_name, 'eggpass-auth-v')) ||
      (github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/tags/eggpass-auth-v'))
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact source associated with a published auth release.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^eggpass-auth-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected an eggpass-auth-vX.Y.Z tag, got $TAG"
            exit 1
          fi
          version="$(sed -n 's/^version = \"\(.*\)\"$/\1/p' crates/eggpass-auth/Cargo.toml | head -1)"
          tag_version="${TAG#eggpass-auth-v}"
          if [[ "$version" != "$tag_version" ]]; then
            echo "::error::crates/eggpass-auth/Cargo.toml says $version but the release tag says $tag_version"
            exit 1
          fi

      - name: Verify the package
        run: cargo package --locked -p eggpass-auth

      - name: Publish the crate
        if: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'eggpass-auth-v') && !(inputs.dry_run == true) }}
        run: cargo publish --locked -p eggpass-auth
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
