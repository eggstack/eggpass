name: Python eggpass-auth

on:
  push:
    branches: [main]
    paths:
      - "python/eggpass-auth/**"
      - "crates/eggpass-auth/**"
      - ".github/workflows/python-auth.yml"
      - ".github/workflows/publish-eggpass-auth-pypi.yml"
  pull_request:
    branches: [main]
    paths:
      - "python/eggpass-auth/**"
      - "crates/eggpass-auth/**"
      - ".github/workflows/python-auth.yml"
      - ".github/workflows/publish-eggpass-auth-pypi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-auth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-and-local-tests:
    name: Rust checks and local Python tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python/eggpass-auth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Create Python virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install Python build and test tools
        run: python -m pip install "maturin==1.16.0" pytest mypy

      - name: Check the vendored Rust source snapshot
        run: python tools/sync_core.py --check

      - name: Check Rust formatting, lint, and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked

      - name: Build and install the local extension
        run: maturin develop --release --locked

      - name: Check stubs and run local-stub tests
        run: |
          mypy --strict tests/typecheck_api.py
          pytest -q

  build-wheels:
    name: Build ${{ matrix.platform.name }} wheel
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            manylinux: "2014"
            interpreter: python3.11
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            manylinux: "2014"
            interpreter: python3.11
          - name: macos-x86_64
            runner: macos-15-intel
            manylinux: "off"
            interpreter: python
          - name: macos-arm64
            runner: macos-15
            manylinux: "off"
            interpreter: python
          - name: windows-x86_64
            runner: windows-2025
            manylinux: "off"
            interpreter: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check the vendored Rust source snapshot
        run: python tools/sync_core.py --check
        working-directory: python/eggpass-auth

      - name: Build stable-ABI wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          manylinux: ${{ matrix.platform.manylinux }}
          args: >-
            --release --locked --interpreter ${{ matrix.platform.interpreter }}
            --out dist
          working-directory: python/eggpass-auth

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.name }}
          path: python/eggpass-auth/dist/*.whl
          if-no-files-found: error
          retention-days: 14

  test-wheels:
    name: Test ${{ matrix.platform.name }} on Python ${{ matrix.python }}
    needs: build-wheels
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-x86_64
            runner: macos-15-intel
          - name: macos-arm64
            runner: macos-15
          - name: windows-x86_64
            runner: windows-2025
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: python/eggpass-auth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform.name }}
          path: python/eggpass-auth/dist

      - name: Install wheel and test the installed package
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest mypy
          python -m pip install --no-deps dist/*.whl
          python -m pip check
          python -c "import eggpass_auth; print(eggpass_auth.__all__)"
          mypy --strict tests/typecheck_api.py
          pytest -q

  build-sdist:
    name: Build and inspect source distribution
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python/eggpass-auth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install Maturin and metadata checker
        run: python -m pip install "maturin==1.16.0" twine

      - name: Check the vendored Rust source snapshot
        run: python tools/sync_core.py --check

      - name: Build and validate source distribution metadata
        run: |
          maturin sdist --out dist
          python -m twine check dist/*.tar.gz
          python - <<'PY'
          from pathlib import Path
          import tarfile

          archives = list(Path("dist").glob("*.tar.gz"))
          assert len(archives) == 1, f"expected one sdist, found {archives}"
          with tarfile.open(archives[0]) as archive:
              members = archive.getnames()
          required = (
              "/README.md",
              "/LICENSE",
              "/Cargo.toml",
              "/Cargo.lock",
              "/src/lib.rs",
              "/vendor/eggpass-auth/Cargo.toml",
              "/vendor/eggpass-auth/src/lib.rs",
          )
          missing = [
              suffix
              for suffix in required
              if not any(name.endswith(suffix) for name in members)
          ]
          assert not missing, f"sdist is missing required files: {missing}"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: python/eggpass-auth/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  test-sdist:
    name: Build and test sdist on Python ${{ matrix.python }}
    needs: build-sdist
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: python/eggpass-auth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: python/eggpass-auth/dist

      - name: Install source distribution and run package checks
        run: |
          python -m pip install --upgrade pip pytest mypy
          python -m pip install --no-deps dist/*.tar.gz
          python -m pip check
          python -c "import eggpass_auth; print(eggpass_auth.__all__)"
          mypy --strict tests/typecheck_api.py
          pytest -q
