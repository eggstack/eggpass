name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup component add rustfmt clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run the tests
        run: cargo test --all-targets --locked

      - name: Package eggpass-auth
        run: cargo package --locked --allow-dirty -p eggpass-auth

      - name: Package eggpass
        run: >-
          cargo package --locked --allow-dirty -p eggpass
          --config 'patch.crates-io.eggpass-auth.path="crates/eggpass-auth"'

      - name: Build the release binary
        run: cargo build --release --locked

  windows-msvc:
    name: Windows MSVC tests and release build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.89.0"
          targets: "x86_64-pc-windows-msvc"

      - uses: Swatinem/rust-cache@v2

      - name: Run Windows tests
        shell: bash
        run: cargo +'1.89.0' test --all-targets --locked --target x86_64-pc-windows-msvc

      - name: Build Windows release binary
        shell: bash
        run: cargo +'1.89.0' build --release --locked --target x86_64-pc-windows-msvc --package eggpass --bin eggpass

  release-drift:
    name: check the generated release workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Eggpack
        run: |
          revision="$(python3 -c "import json,sys;sys.stdout.write(json.load(open('release/eggpack/github-policy.json'))['eggpack_tool']['revision'])")"
          cargo install --git https://github.com/eggstack/eggpack --rev "$revision" --locked eggpack-cli
          eggpack --version

      - name: Check generated release workflow
        run: >-
          eggpack ci check
          --workflow-shape release/eggpack/workflow-shape.json
          --contract release/eggpack/distribution.toml
          --github-policy release/eggpack/github-policy.json
          --workflow .github/workflows/release.yml
